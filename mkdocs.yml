site_name: TRESOMAT Dokumentation
site_url: https://docs.tresomat.ch/
site_description: Dokumentation für TRESOMAT, Web-Portal und Integration API.
copyright: TRESOMAT

theme:
  name: material
  language: de
  custom_dir: docs/overrides
  font: false
  favicon: assets/branding/favicon.png
  # Nach Bereitstellung des finalen Logos aktivieren:
  # logo: assets/branding/tresomat-logo.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Dunkles Farbschema verwenden
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Helles Farbschema verwenden
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.highlight
    - search.share
    - content.code.copy
    - content.tabs.link

plugins:
  - search:
      lang: de

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - assets/stylesheets/tresomat.css

extra_javascript:
  - assets/javascripts/tresomat.js

extra:
  generator: false
  social:
    - icon: fontawesome/solid/globe
      link: https://tresomat.ch
      name: TRESOMAT Website

