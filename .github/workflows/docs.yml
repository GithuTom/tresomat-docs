name: Validate and deploy documentation

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install -r requirements.txt
      - name: Build public documentation
        run: mkdocs build --strict -f mkdocs.public.yml
      - name: Verify public/private separation
        run: python scripts/verify_public_build.py site-public
      - name: Build protected documentation
        run: mkdocs build --strict -f mkdocs.protected.yml
      - uses: actions/upload-artifact@v4
        with:
          name: protected-documentation
          path: site-protected
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-public
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy public documentation
        id: deployment
        uses: actions/deploy-pages@v4
