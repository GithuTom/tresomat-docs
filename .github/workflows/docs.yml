name: Validate and deploy documentation

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install -r requirements.txt
      - name: Build and verify Public
        run: |
          mkdocs build --strict -f mkdocs.public.yml
          python scripts/verify_role_build.py public site-public
      - name: Build and verify Techdocs
        run: |
          mkdocs build --strict -f mkdocs.techdocs.yml
          python scripts/verify_role_build.py techdocs site-techdocs
      - name: Build and verify API
        run: |
          mkdocs build --strict -f mkdocs.api.yml
          python scripts/verify_role_build.py api site-api
      - uses: actions/upload-artifact@v4
        with:
          name: tresomat-techdocs
          path: site-techdocs
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: tresomat-api-docs
          path: site-api
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-public
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Public
        id: deployment
        uses: actions/deploy-pages@v4
